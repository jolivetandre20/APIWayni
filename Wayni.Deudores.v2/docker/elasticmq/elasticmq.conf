include classpath("application.conf")

# host = "*": queue URLs are built from the Host header, so they work inside the docker network.
node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  deudores-import {
    defaultVisibilityTimeout = 300 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "deudores-import-dlq"
      maxReceiveCount = 3
    }
  }
  deudores-import-dlq {}
}
